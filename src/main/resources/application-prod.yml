server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:3}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}

jwt:
  secret: ${JWT_SECRET}
  access-expire-ms: ${JWT_ACCESS_EXPIRE_MS:7200000}
  refresh-expire-ms: ${JWT_REFRESH_EXPIRE_MS:604800000}
  cookie-secure: ${JWT_COOKIE_SECURE:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

file:
  upload-dir: ${FILE_UPLOAD_DIR:/app/uploads}
  base-url: ${FILE_BASE_URL}

dgame:
  rabbitmq:
    notification:
      listener:
        concurrency: ${NOTIFICATION_LISTENER_CONCURRENCY:4}
        max-concurrency: ${NOTIFICATION_LISTENER_MAX_CONCURRENCY:8}
        prefetch: ${NOTIFICATION_LISTENER_PREFETCH:10}
      executor:
        core-size: ${NOTIFICATION_EXECUTOR_CORE_SIZE:4}
        max-size: ${NOTIFICATION_EXECUTOR_MAX_SIZE:8}
        queue-capacity: ${NOTIFICATION_EXECUTOR_QUEUE_CAPACITY:200}

logging:
  level:
    com.xiaoyang.d_game: info
